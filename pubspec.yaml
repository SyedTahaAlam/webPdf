name: webpdf
description: WebPdf - Convert websites to PDF documents
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: any
  riverpod_annotation: any
  flutter_inappwebview: any
  pdf: any
  printing: any
  path_provider: any
  share_plus: any
  permission_handler: any
  google_mobile_ads: any
  google_fonts: any
  shimmer: any
  animations: any
  flutter_svg: any
  lottie: any
  smooth_page_indicator: any
  connectivity_plus: any
  intl: any
  freezed_annotation: any
  json_annotation: any
  dartz: any
  logger: any
  equatable: any
  image: any
  uuid: any
  shared_preferences: any
  hive: any
  hive_flutter: any
  firebase_core: any
  firebase_crashlytics: any
  firebase_analytics: any
  cupertino_icons: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  very_good_analysis: any
  build_runner: any
  freezed: any
  json_serializable: any
  riverpod_generator: any
  hive_generator: any
  source_gen: any
  mocktail: any
  flutter_native_splash: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/splash/
    - assets/illustrations/

  fonts: []

flutter_native_splash:
  color: "#1A73E8"
  image: assets/splash/splash_logo.png
  android: true
  ios: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
